name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    name: Rust (${{ matrix.os }})
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Verification runner tests (no desktop effects)
        run: python -m unittest discover -s tests -p "test_*.py"
      - run: cargo run --locked -p scriptaro-example
      - run: cargo run --locked -- validate examples/tutorial-macos.yaml
      - run: cargo run --locked -- run examples/tutorial-macos.yaml --dry-run

  documentation:
    name: Documentation (build only)
    # Generate the macOS-specific Rust API as well as the portable crates.
    runs-on: macos-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run docs:build
