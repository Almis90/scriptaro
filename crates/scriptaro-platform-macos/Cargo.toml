[package]
name = "scriptaro-platform-macos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
scriptaro-core.workspace = true
scriptaro-platform.workspace = true
tokio.workspace = true
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace", "NSRunningApplication", "block2", "libc"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSString", "NSURL", "NSError"] }
block2 = "0.6"
core-graphics = { version = "0.25", features = ["highsierra"] }
core-foundation = "0.10"

[lints]
workspace = true
