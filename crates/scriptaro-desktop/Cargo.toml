[package]
name = "scriptaro-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
scriptaro-core.workspace = true
scriptaro-engine.workspace = true
scriptaro-platform.workspace = true
tokio.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
scriptaro-platform-macos.workspace = true
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSAlert", "NSWindow", "NSView", "NSResponder", "NSControl", "NSCell", "NSButton", "NSTextField", "NSText", "NSTextView", "NSScrollView", "NSPopUpButton", "NSMenu", "NSMenuItem", "NSEvent", "NSFont", "NSOpenPanel", "NSSavePanel", "NSPanel", "NSGraphics", "NSColor", "NSBitmapImageRep", "NSImageRep", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSString", "NSObject", "NSDate", "NSRunLoop", "NSURL", "NSGeometry", "NSUndoManager", "NSData", "NSDictionary"] }

[lints]
workspace = true
